services:
  imixs-db:
    image: postgres:13.11
    environment:
      POSTGRES_PASSWORD: adminadmin
      POSTGRES_DB: workflow-db
    volumes:
      - dbdata:/var/lib/postgresql/data

  imixs-app:
    image: imixs/imixs-process-manager:latest
    environment:
      TZ: "CET"
      LANG: "en_US.UTF-8"
      JAVA_OPTS: >-
        -XX:MaxRAMPercentage=75.0
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -XX:InitiatingHeapOccupancyPercent=45
        -Djava.net.preferIPv4Stack=true
        -Djava.awt.headless=true
        -Djboss.modules.system.pkgs=org.jboss.byteman,com.sun.management,jdk.incubator.vector
        --add-modules=jdk.incubator.vector
        --enable-native-access=ALL-UNNAMED

      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "adminadmin"
      POSTGRES_CONNECTION: "jdbc:postgresql://imixs-db/workflow-db"
      INDEX_DIRECTORY: "/opt/jboss/lucene/imixs-workflow-index"
      MAILGATEWAY: "localhost"
      METRICS_ENABLED: "true"

      ASYNCEVENT_PROCESSOR_ENABLED: "true"
      ASYNCEVENT_PROCESSOR_INITIALDELAY: "10000"

    ports:
      - "8080:8080"
      - "8787:8787"
      - "9990:9990"
    volumes:
      - index:/opt/jboss/lucene/
      - ./docker/deployments:/opt/jboss/wildfly/standalone/deployments/

  imixsadmin:
    image: imixs/imixs-admin:latest
    ports:
      - "8888:8080"

volumes:
  dbdata:
    name: imixs-process-manager-dbdata
  index:
    name: imixs-process-manager-index
